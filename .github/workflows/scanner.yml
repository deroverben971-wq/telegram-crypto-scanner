name: Binance spot scanner
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram connectivity test instead of scanning"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: read
concurrency:
  group: spot-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore alert cooldown state
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Telegram connectivity test
        if: github.event_name == 'workflow_dispatch' && inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --test-telegram
      - name: Scan market
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.test_telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Save alert cooldown state
        if: always() && hashFiles('.state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state.json
          key: scanner-state-${{ github.run_id }}
