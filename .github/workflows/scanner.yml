name: Binance spot scanner
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram connectivity test instead of scanning"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: spot-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore alert cooldown state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state.json
            .paper_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-
      - name: Restore durable state from paper-state branch
        shell: bash
        run: |
          if git fetch origin paper-state:refs/remotes/origin/paper-state 2>/dev/null; then
            if git cat-file -e origin/paper-state:.paper_state.json 2>/dev/null; then
              git show origin/paper-state:.paper_state.json > .paper_state.json
            fi
            if git cat-file -e origin/paper-state:.state.json 2>/dev/null; then
              git show origin/paper-state:.state.json > .state.json
            fi
          else
            echo "No durable state branch yet; starting initial ledger."
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Telegram connectivity test
        if: github.event_name == 'workflow_dispatch' && inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --test-telegram
      - name: Scan market
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.test_telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Persist state to paper-state branch
        if: always() && (hashFiles('.state.json') != '' || hashFiles('.paper_state.json') != '')
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/scanner-state
          cp .paper_state.json /tmp/scanner-state/ 2>/dev/null || true
          cp .state.json /tmp/scanner-state/ 2>/dev/null || true
          git switch --orphan paper-state-new
          git branch -M paper-state
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/scanner-state/.paper_state.json .paper_state.json 2>/dev/null || true
          cp /tmp/scanner-state/.state.json .state.json 2>/dev/null || true
          if [ -f .paper_state.json ]; then git add .paper_state.json; fi
          if [ -f .state.json ]; then git add .state.json; fi
          if git diff --cached --quiet; then
            echo "No state files changed; nothing to persist."
            exit 0
          fi
          git commit -m "Persist scanner paper-tracking state"
          git push origin HEAD:paper-state --force
      - name: Save alert cooldown state
        if: always() && (hashFiles('.state.json') != '' || hashFiles('.paper_state.json') != '')
        uses: actions/cache/save@v4
        with:
          path: |
            .state.json
            .paper_state.json
          key: scanner-state-${{ github.run_id }}
