name: Five-year historical backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "backtest.py"
      - "validation_report.py"
      - "tests/**"
      - ".github/workflows/backtest.yml"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run approximate five-year backtest
        run: python backtest.py
      - name: Statistical evidence report
        if: always() && hashFiles('backtest_results.csv') != ''
        run: python validation_report.py | tee validation_report.txt
      - name: Save backtest and validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-year-backtest-validation
          path: |
            backtest_results.csv
            backtest_relaxed_results.csv
            validation_report.txt
          if-no-files-found: warn
          retention-days: 30
