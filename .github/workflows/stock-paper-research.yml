name: Stock paper research scan
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated supported US symbols (max 20; daily adjusted premium API required)"
        required: false
        type: string
        default: "AAPL,MSFT,NVDA,AMZN,GOOGL,SPY,QQQ"
permissions:
  contents: read
concurrency:
  group: stock-paper-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run US stock paper screen
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          STOCK_SYMBOLS: ${{ inputs.symbols }}
        run: python stock_scan.py
      - name: Upload research results
        if: always() && hashFiles('stock_research_results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stock-paper-research-results
          path: stock_research_results.json
          if-no-files-found: warn
          retention-days: 30
